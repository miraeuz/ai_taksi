name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend pytest (SQLite suite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_taksi_data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_taksi_data/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app scripts tests alembic
      - run: python -m pytest -q

  backend-postgres:
    name: Backend on PostgreSQL 16 + PostGIS 3.4
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_taksi_data
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: aitaksi
          POSTGRES_USER: aitaksi
          POSTGRES_PASSWORD: aitaksi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aitaksi -d aitaksi"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://aitaksi:aitaksi@localhost:5432/aitaksi
      JWT_SECRET: ci-only-jwt-secret-0000000000000000000000000000
      OTP_SECRET: ci-only-otp-secret-0000000000000000000000000000
      SMS_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai_taksi_data/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrate (alembic upgrade head)
        run: alembic upgrade head
      - name: Seed demo data
        run: python -m scripts.seed
      - name: Seed is idempotent (second run)
        run: python -m scripts.seed
      - name: Models match migrations (informational)
        continue-on-error: true
        run: alembic check
      - name: API smoke test against real database
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/openapi.json -o /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/openapi.json | python -c "import sys,json; d=json.load(sys.stdin); print(len(d['paths']), 'paths')"
          kill %1

  flutter-android:
    name: Flutter analyze, test, debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_taksi_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate Android scaffold but keep our manifests
        run: |
          mkdir -p /tmp/manifests
          cp android/app/src/main/AndroidManifest.xml /tmp/manifests/main.xml
          cp android/app/src/debug/AndroidManifest.xml /tmp/manifests/debug.xml
          flutter create --platforms=android --project-name ai_taksi --org uz.aitaksi .
          cp /tmp/manifests/main.xml android/app/src/main/AndroidManifest.xml
          cp /tmp/manifests/debug.xml android/app/src/debug/AndroidManifest.xml
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000
      - uses: actions/upload-artifact@v4
        with:
          name: ai-taksi-debug-apk
          path: ai_taksi_flutter/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
