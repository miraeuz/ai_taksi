services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: aitaksi
      POSTGRES_USER: aitaksi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitaksi}
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aitaksi -d aitaksi']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log
    ports: ['8000:8000']
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://aitaksi:${POSTGRES_PASSWORD:-aitaksi}@db:5432/aitaksi
      CELERY_BROKER_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET in .env}
      SMS_PROVIDER: ${SMS_PROVIDER:-fake}
  worker:
    build: .
    command: celery -A app.tasks:celery_app worker --loglevel=info --concurrency=1
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    environment: *app_env
  beat:
    build: .
    command: celery -A app.tasks:celery_app beat --loglevel=info
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    environment: *app_env
  data:
    build: .
    depends_on:
      db: {condition: service_healthy}
    profiles: [tools]
    environment: *app_env
volumes:
  pgdata:
